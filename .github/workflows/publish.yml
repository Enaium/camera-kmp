name: Publish

on:
  workflow_dispatch:

# Publishes every artifact from the runner that can build it. Maven Central
# coordinates are immutable, so each publication is produced by exactly one
# runner:
#
#   macos-14      -> :camera-kmp metadata + jvm + macOS + iOS klibs
#   ubuntu-latest -> :camera-kmp linuxX64 + linuxArm64 + js + wasmJs klibs
#   ubuntu-latest -> :camera-kmp mingwX64 klib (cross compiled with the
#                    Kotlin/Native MinGW sysroot, which provides the Media
#                    Foundation headers and import libraries)
#   ubuntu-latest -> :camera-kmp android AAR + androidNative klibs
#   ubuntu-latest -> @enaium/camera-kmp npm package
#
# The kotlinMultiplatform metadata module (published from macOS) redirects to
# the per-target klib modules, so all of them have to be published before
# consumers can resolve the artifact.
#
# Trigger: run manually from the Actions tab. The published version is the one
# in build.gradle.kts (allprojects.version).
#
# Required repository secrets:
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal user-token password
#   SIGNING_KEY              base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID           8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD         Passphrase of the signing key
#   NPM_PUBLISH_KEY          npm token, written to ~/.gradle/gradle.properties
#                            as npm.publish.key before the npm publish step

jobs:
  publish-macos:
    name: Publish macOS / iOS klibs and metadata
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish the Apple and portable artifacts
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :camera-kmp:publishKotlinMultiplatformPublicationToMavenCentralRepository
          :camera-kmp:publishJvmPublicationToMavenCentralRepository
          :camera-kmp:publishMacosArm64PublicationToMavenCentralRepository
          :camera-kmp:publishMacosX64PublicationToMavenCentralRepository
          :camera-kmp:publishIosArm64PublicationToMavenCentralRepository
          :camera-kmp:publishIosX64PublicationToMavenCentralRepository
          :camera-kmp:publishIosSimulatorArm64PublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-linux:
    name: Publish Linux, web and Windows klibs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish the portable, Linux, web and Windows artifacts
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :camera-kmp:publishLinuxX64PublicationToMavenCentralRepository
          :camera-kmp:publishLinuxArm64PublicationToMavenCentralRepository
          :camera-kmp:publishMingwX64PublicationToMavenCentralRepository
          :camera-kmp:publishJsPublicationToMavenCentralRepository
          :camera-kmp:publishWasmJsPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-android:
    name: Publish Android (AAR + androidNative klibs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Install the Android platform
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish the AAR and the androidNative klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :camera-kmp:publishAndroidPublicationToMavenCentralRepository
          :camera-kmp:publishAndroidNativeArm64PublicationToMavenCentralRepository
          :camera-kmp:publishAndroidNativeArm32PublicationToMavenCentralRepository
          :camera-kmp:publishAndroidNativeX64PublicationToMavenCentralRepository
          :camera-kmp:publishAndroidNativeX86PublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-npm:
    name: Publish the @enaium/camera-kmp npm package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish the npm package
        run: |
          install -d "$HOME/.gradle"
          printf 'npm.publish.key=%s\n' "$NPM_PUBLISH_KEY" >> "$HOME/.gradle/gradle.properties"
          ./gradlew --no-daemon --stacktrace :camera-kmp:publishWebNpm
        env:
          NPM_PUBLISH_KEY: ${{ secrets.NPM_PUBLISH_KEY }}
